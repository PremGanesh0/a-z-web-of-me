# Publishes the portfolio and PREM OS to premganeshd.web.app whenever main changes.
# One-time setup: add the repository secret FIREBASE_SERVICE_ACCOUNT_PREMGANESHD
# (Settings → Secrets and variables → Actions) containing the full service-account JSON.
name: Deploy to Firebase Hosting
on:
  push:
    branches: [main]
    paths: ["portfolio/**", "firebase.json"]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: firebase-hosting
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PREMGANESHD }}
          projectId: premganeshd
          channelId: live
